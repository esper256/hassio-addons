configuration:
  world_name:
    name: Save name
    description: Factorio save file name without .zip (e.g. FamilyFactory). Created under /data/world/saves/ on first start or after NEW WORLD.
  server_name:
    name: Server name
    description: "Optional name shown in the Factorio server browser / LAN list. Leave blank to use a stable generated name like HAOS Factorio 4821 (same digits for this install; different across installs)."
  server_description:
    name: Server description
    description: Description shown in the Factorio server listing.
  server_password:
    name: Game password
    description: Password required to join (Factorio game_password). Leave empty for an open server.
  server_slots:
    name: Max players
    description: Maximum concurrent players (0 = unlimited in Factorio).
  auto_pause:
    name: Pause when empty
    description: Pause the simulation when no players are connected.
  autosave_interval:
    name: Autosave interval (minutes)
    description: Minutes between Factorio autosaves (default 10).
  visibility_lan:
    name: LAN visibility
    description: Broadcast the server on the local network (Play on LAN).
  visibility_public:
    name: Public server listing
    description: "Publish on the official Factorio matching server. Requires a Factorio.com username and token below. Default off (LAN / direct connect)."
  factorio_username:
    name: Factorio.com username
    description: Optional Factorio.com account username. Required only for public listing.
  factorio_token:
    name: Factorio.com token
    description: Optional Factorio.com authentication token (preferred over password). Required only for public listing. Keep secret.
  update_on_start:
    name: Update on start
    description: Check factorio.com for a newer free headless package before launching the server.
  auto_update_interval_minutes:
    name: Auto-update interval (minutes)
    description: Used only when “Daily update check hour” is empty. How often to ask factorio.com whether a newer headless package exists. 0 turns periodic checks off. Values below 15 are raised to 15.
  auto_update_check_hour:
    name: Daily update check hour
    description: Local hour (0–23) to ask factorio.com once per day for a newer headless package. Default is 5 (5:00am). Leave empty to use the interval setting instead.
  update_when_empty_only:
    name: Update only when empty
    description: When a newer package is ready, wait until nobody is online before restarting so players are not interrupted. Requires working player join/leave detection (configured log patterns) — without that, emptiness cannot be determined and updates will not proceed while this is on.
  update_on_version_mismatch:
    name: Update on version mismatch
    description: If clients are rejected for a wrong/outdated version, check factorio.com for a newer package and only then restart to update.
  debug_mode:
    name: Debug mode
    description: Show Ingress log-watch pattern tooling (dry-run regex hits) and keep the Number of players card visible even when player-count patterns are still dry-run. Leave off for normal operation.
  update_window_start_hour:
    name: Update window start hour
    description: Optional local hour (0-23) when routine Steam updates may begin. Leave empty for any time.
  update_window_end_hour:
    name: Update window end hour
    description: Optional local hour (0-23) when routine Steam updates must stop. Leave empty for any time.
  restart_on_crash:
    name: Restart on crash
    description: Automatically relaunch the server process after an unexpected exit.
  status_http_enabled:
    name: Status page
    description: Serve the supervisor status/log HTTP UI used by Home Assistant OPEN WEB UI (Ingress on port 8099).
  ha_notifications:
    name: Home Assistant notifications
    description: Create persistent notifications on crash, update failure, and version mismatch (uses HA Core API, not MQTT).
  backup_enabled:
    name: Enable backups
    description: Daily backup of the active world save (.zip copied as-is) into /data/backups. History is thinned by the retention profile below.
  backup_on_update:
    name: Backup before update
    description: Back up the world save immediately before a Steam update. Only the newest pre-update backup is kept.
  backup_retention:
    name: Backup retention
    description: "Scheduled history uses daily→weekly→monthly thinning; pre-restore safety copies use the same profile (minimal=1 day, standard=7 days, extended=30 days). Only one pre-update backup is kept."
  min_free_disk_mb:
    name: Minimum free disk (MiB)
    description: Skip backups/updates when free space under /data falls below this threshold.
network:
  34197/udp: Game port players use in Factorio to reach this server on your Home Assistant machine (UDP). Leave at 34197 unless that port is already taken.
