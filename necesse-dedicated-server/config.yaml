name: "Necesse Dedicated Server"
description: "Necesse dedicated multiplayer server with SteamCMD auto-updates, player-aware restarts, generational world backups, and an Ingress status/log toolkit."
version: "2.1.2"
slug: "necesse_dedicated_server"
url: "https://github.com/esper256/hassio-addons/tree/main/necesse-dedicated-server"
arch:
  - amd64
startup: application
boot: auto
init: false
host_network: false
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8080
ingress_entry: /
panel_icon: mdi:sword
panel_title: Necesse
ports:
  14159/udp: 14159
  8080/tcp: null
ports_description:
  14159/udp: Necesse game traffic (UDP)
  8080/tcp: Status dashboard (also available via Ingress)
map:
  - type: share
    read_only: false
options:
  world_name: "FamilyWorld"
  server_password: ""
  server_slots: 10
  server_port: 14159
  server_owner: ""
  server_motd: "Welcome to the family Necesse server!"
  pause_when_empty: true
  give_clients_power: false
  enable_logging: true
  zip_saves: true
  server_language: "en"
  java_opts: "-Xms512M -Xmx2G"
  update_on_start: true
  auto_update_interval_minutes: 30
  update_when_empty_only: true
  update_on_version_mismatch: true
  restart_on_crash: true
  status_http_enabled: true
  ha_notifications: true
  backup_enabled: true
  backup_interval_minutes: 360
  backup_on_update: true
  backup_keep_recent: 5
  backup_keep_daily: 7
  backup_keep_weekly: 5
  backup_keep_monthly: 12
  backup_keep_yearly: 3
  min_free_disk_mb: 512
schema:
  world_name: str
  server_password: password
  server_slots: int(1,250)
  server_port: port
  server_owner: str?
  server_motd: str
  pause_when_empty: bool
  give_clients_power: bool
  enable_logging: bool
  zip_saves: bool
  server_language: str
  java_opts: str?
  update_on_start: bool
  auto_update_interval_minutes: int(0,)
  update_when_empty_only: bool
  update_on_version_mismatch: bool
  update_window_start_hour: int(0,23)?
  update_window_end_hour: int(0,23)?
  restart_on_crash: bool
  status_http_enabled: bool
  ha_notifications: bool
  backup_enabled: bool
  backup_interval_minutes: int(0,)
  backup_on_update: bool
  backup_keep_recent: int(1,50)
  backup_keep_daily: int(0,60)
  backup_keep_weekly: int(0,52)
  backup_keep_monthly: int(0,36)
  backup_keep_yearly: int(0,10)
  min_free_disk_mb: int(0,)
backup_exclude:
  - "**/steamapps/**"
  - "**/steamcmd/**"
  - "game/**"
watchdog: http://[HOST]:[PORT:8080]/healthz
# First boot runs SteamCMD and can take several minutes on a cold cache.
timeout: 600
