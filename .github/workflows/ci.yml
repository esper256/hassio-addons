name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vendored game_server sync
        run: ./game-server-base/check-addon-sync.sh

      - name: Unit tests
        # Prefer unittest so CI does not need a separate pytest install.
        run: python -m unittest discover -s game-server-base/tests -q
