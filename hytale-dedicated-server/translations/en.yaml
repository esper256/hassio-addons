configuration:
  world_name:
    name: World name
    description: Hytale world name under universe/worlds (e.g. default). Created on first start.
  server_name:
    name: Server name
    description: "Optional name shown to players. Leave blank to use a stable generated name like HAOS Hytale 4821 (same digits for this install; different across installs)."
  server_motd:
    name: MOTD
    description: Message of the day in config.json.
  server_password:
    name: Game password
    description: Password required to join. Leave empty for an open server.
  server_slots:
    name: Max players
    description: Maximum concurrent players (config.json MaxPlayers).
  java_opts:
    name: Java options
    description: JVM flags (default -Xms2G -Xmx4G). Official guidance is at least 4 GB RAM for the host.
  release_channel:
    name: Release channel
    description: "Which Hytale patchline to download. Release matches the current retail client; Pre-release tracks newer builds (clients must match exactly)."
  update_on_start:
    name: Update on start
    description: Run the official downloader before launching (uses the saved download login after first sign-in).
  auto_update_interval_minutes:
    name: Auto-update interval (minutes)
    description: Used only when “Daily update check hour” is empty. How often to ask the downloader whether a newer package exists. 0 turns periodic checks off. Values below 15 are raised to 15.
  auto_update_check_hour:
    name: Daily update check hour
    description: Local hour (0–23) to check once per day for a newer dedicated-server package. Default is 5 (5:00am). Leave empty to use the interval setting instead.
  update_when_empty_only:
    name: Update only when empty
    description: When a newer package is ready, wait until nobody is online before restarting. Join/leave tracking is dry-run until log patterns are promoted from a live session.
  update_on_version_mismatch:
    name: Update on version mismatch
    description: Unused until a live boot proves a mismatch log line. Leave off.
  debug_mode:
    name: Debug mode
    description: Show Ingress log-watch pattern tooling (dry-run regex hits) for optional further tuning. Leave off for normal operation.
  update_window_start_hour:
    name: Update window start hour
    description: Optional local hour (0-23) when routine package updates may begin. Leave empty for any time.
  update_window_end_hour:
    name: Update window end hour
    description: Optional local hour (0-23) when routine package updates must stop. Leave empty for any time.
  restart_on_crash:
    name: Restart on crash
    description: Automatically relaunch the server process after an unexpected exit.
  status_http_enabled:
    name: Status page
    description: Serve the supervisor status/log HTTP UI used by Home Assistant OPEN WEB UI (Ingress on port 8099).
  ha_notifications:
    name: Home Assistant notifications
    description: Create persistent notifications on crash, update failure, and version mismatch (uses HA Core API, not MQTT).
  backup_enabled:
    name: Enable backups
    description: Daily backup of the active universe folder into /data/backups. History is thinned by the retention profile below.
  backup_on_update:
    name: Backup before update
    description: Back up the universe immediately before a package update. Only the newest pre-update backup is kept.
  backup_retention:
    name: Backup retention
    description: "Scheduled history uses daily→weekly→monthly thinning; pre-restore safety copies use the same profile (minimal=1 day, standard=7 days, extended=30 days). Only one pre-update backup is kept."
  min_free_disk_mb:
    name: Minimum free disk (MiB)
    description: Skip backups/updates when free space under /data falls below this threshold. Keep extra room for Assets.zip (~3 GB).
network:
  5520/udp: Official Hytale dedicated-server port (UDP/QUIC). Join with host:5520 in Direct Connect. TCP is not used.
